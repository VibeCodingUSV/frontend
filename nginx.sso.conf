
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control "no-store" always;

  # OAuth2 Proxy gestioneaza redirectul către furnizorul OIDC și callback-ul /oauth2/callback.
  location /oauth2/ {
    proxy_pass http://oauth2-proxy:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect https://$host$request_uri;
  }

  # Subcerere internă: răspuns 202 dacă sesiunea este validă, 401 în caz contrar.
  location = /oauth2/auth {
    internal;
    proxy_pass http://oauth2-proxy:4180/oauth2/auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
  }

  # API: păstrăm statusul 401 pentru client; nu redirecționăm răspunsurile API către HTML.
  location /api/ {
    auth_request /oauth2/auth;
    auth_request_set $rrm_auth_email $upstream_http_x_auth_request_email;
    auth_request_set $rrm_auth_username $upstream_http_x_auth_request_preferred_username;

    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Suprascriem headerele venite de la browser. Backend-ul primește doar identitatea verificată de OAuth2 Proxy.
    proxy_set_header X-Auth-Request-Email $rrm_auth_email;
    proxy_set_header X-Auth-Request-Preferred-Username $rrm_auth_username;
    proxy_set_header X-Auth-Request-User $rrm_auth_username;
    proxy_set_header X-User-Id "";
  }

  # Browser: utilizatorii fără sesiune sunt trimiși la autentificarea OIDC.
  location / {
    auth_request /oauth2/auth;
    error_page 401 = @rrm_oauth2_signin;
    try_files $uri $uri/ /index.html;
  }

  location @rrm_oauth2_signin {
    return 302 /oauth2/start?rd=https://$host$request_uri;
  }
}
